# VOUPVAPCASH — livraison.
#
#   docker compose up -d --build              # app sur http://127.0.0.1:8080
#   docker compose --profile tls up -d --build  # + HTTPS automatique (Caddy)
#
# Guide complet : docker/README.md

name: voupvapcash

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: voupvapcash-api:${APP_VERSION:-latest}
    restart: unless-stopped
    init: true
    # Laisse finir un envoi Bazik en cours avant l'arrêt (voir SHUTDOWN_GRACE_MS).
    stop_grace_period: 30s
    env_file:
      - path: ${API_ENV_FILE:-server/.env}
        required: true
    # Ces valeurs l'emportent sur le fichier .env : elles décrivent le conteneur.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4500"
      APP_DB_PATH: /data/app.db
      OTP_DB_PATH: /data/otp_db.json
      BACKUP_DIR: /data/backups
    volumes:
      - app-data:/data
    # Pas de port publié : l'API n'est joignable qu'à travers `web`.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-}
    image: voupvapcash-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        # nginx résout `api` une seule fois au démarrage. Si seule l'API est
        # reconstruite, elle change d'IP et `web` renverrait des 502 : on le
        # redémarre avec elle.
        restart: true
    # Par défaut sur 127.0.0.1 : une app qui manipule de l'argent ne s'expose
    # pas en HTTP clair. Voir HTTP_BIND dans .env.example.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  # La base SQLite, les OTP et les sauvegardes. Ne jamais supprimer sans sauvegarde.
  app-data:
  caddy-data:
  caddy-config:
