# VOUPVAPCASH — app Flutter web + relais vers l'API.
#
# Ce fichier est inclus dans le bloc `http` de nginx (conf.d/default.conf).

# Adresse réelle du client quand un proxy TLS (Caddy, nginx de l'hôte, load
# balancer) est placé devant : sans ça, la limite de débit ci-dessous verrait
# tout le monde avec l'IP du proxy et bloquerait tous les agents à la fois.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Connexion et OTP : freine le bourrage d'identifiants et la consommation du
# quota d'e-mails. Un comptoir entier derrière une même box reste bien en dessous.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_status 429;

upstream api {
    server api:4500;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm
               text/css text/plain image/svg+xml font/otf font/ttf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API ------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un envoi Bazik peut prendre ~20 s (délai du client Bazik) : on laisse de
    # la marge pour ne pas couper une requête dont l'issue serait alors inconnue.
    proxy_read_timeout 60s;

    location ~ ^/api/(auth/login|auth/bootstrap|otp/) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api;
    }

    # Le webhook Bazik est signé sur le corps brut : nginx le transmet tel quel.
    location /api/ {
        proxy_pass http://api;
    }

    # --- App --------------------------------------------------------------------
    # Les fichiers Flutter web ne sont pas nommés par empreinte (main.dart.js,
    # canvaskit/…) : on force la revalidation (ETag → 304) pour qu'une mise à
    # jour soit visible sans vider le cache. `expires` n'écrase pas les
    # `add_header` du bloc server, contrairement à un `add_header` ici.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
