# VOUPVAPCASH — vhost provisoire, le temps d'obtenir le premier certificat.
#
# `voupvapcash.tech.conf` référence /etc/letsencrypt/live/voupvapcash.tech/ :
# tant que ce dossier n'existe pas, nginx refuse de démarrer, et sans nginx
# certbot ne peut pas répondre au défi ACME. Ce fichier casse la boucle.
#
# Il est remplacé par le vrai vhost à l'étape 4 du README.

server {
    listen 80;
    listen [::]:80;
    server_name voupvapcash.tech www.voupvapcash.tech;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
