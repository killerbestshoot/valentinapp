# VOUPVAPCASH — vhost nginx de l'hôte pour voupvapcash.tech
#
#   Internet ──► nginx (hôte : TLS) ──► 127.0.0.1:8080 = conteneur `web` ──► `api`
#
# À utiliser À LA PLACE du profil `tls` de docker compose : lancez l'app avec
# `docker compose up -d` (sans `--profile tls`), sinon Caddy et ce vhost se
# disputeraient les ports 80/443.
#
# Installation : voir deploy/nginx/README.md (l'ordre compte — le bloc 443
# ci-dessous ne démarre pas tant que le certificat n'existe pas).

# Le conteneur `web` garde des connexions ouvertes : on évite de rouvrir une
# socket à chaque requête.
upstream voupvapcash_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# --- HTTP : ACME + redirection ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name voupvapcash.tech www.voupvapcash.tech;

    server_tokens off;

    # Le renouvellement Let's Encrypt doit passer en clair : `^~` le place
    # avant la redirection ci-dessous.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://voupvapcash.tech$request_uri;
    }
}

# --- HTTPS : www → apex -------------------------------------------------------
# Une seule origine pour l'app : CORS_ORIGINS, le webhook Bazik et les jetons
# sont déclarés sur https://voupvapcash.tech, pas sur les deux noms.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1 : `listen 443 ssl http2;`
    server_name www.voupvapcash.tech;

    ssl_certificate     /etc/letsencrypt/live/voupvapcash.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voupvapcash.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://voupvapcash.tech$request_uri;
}

# --- HTTPS : l'app ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voupvapcash.tech;

    ssl_certificate     /etc/letsencrypt/live/voupvapcash.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voupvapcash.tech/privkey.pem;

    # Fourni par le paquet certbot. Si absent, décommentez le bloc « TLS à la
    # main » plus bas et supprimez cette ligne.
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # --- TLS à la main (sans le fichier certbot) ---
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;

    # Pas d'`ssl_stapling` : les certificats Let's Encrypt ne portent plus
    # d'URL OCSP, la directive ne ferait que remplir le journal d'erreurs.

    server_tokens off;

    # Le conteneur `web` refuse déjà au-delà de 1 Mo : on coupe à l'entrée
    # plutôt que de faire traverser le corps pour rien.
    client_max_body_size 1m;

    # Seul en-tête de sécurité ajouté ici : `web` pose déjà nosniff,
    # X-Frame-Options, Referrer-Policy et Permissions-Policy. Les répéter ici
    # les enverrait en double. HSTS, lui, ne peut venir que du bloc TLS.
    # `preload` n'est pas activé : c'est un aller sans retour, et il engagerait
    # aussi tous les sous-domaines de voupvapcash.tech.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # La compression est faite par `web` (gzip sur js/json/wasm/css) : nginx ne
    # recompresse pas une réponse déjà encodée, inutile de la configurer ici.

    access_log /var/log/nginx/voupvapcash.access.log;
    error_log  /var/log/nginx/voupvapcash.error.log;

    # --- Relais ---------------------------------------------------------------
    # Au niveau du `server` : les `location` ci-dessous en héritent toutes. Dans
    # un seul `location`, les autres partiraient sans en-tête, avec le nom de
    # l'upstream en guise de `Host`.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # $remote_addr et non $proxy_add_x_forwarded_for : ce serveur est en bordure
    # d'Internet. Un client qui envoie son propre X-Forwarded-For verrait sa
    # valeur conservée, et la limite de débit de `web` sur /api/auth/login et
    # /api/otp/ porterait sur une IP inventée.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    # Un envoi Bazik peut prendre ~20 s. Couper avant `web` (60 s) laisserait
    # l'agent sans réponse sur un transfert peut-être parti.
    proxy_read_timeout    60s;

    # Sert le renouvellement même si la validation ACME suit la redirection
    # depuis le port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://voupvapcash_app;
    }

    # Le webhook Bazik est signé sur le corps brut : rien ici ne le réécrit.
    location / {
        proxy_pass http://voupvapcash_app;
    }
}

# --- Rejeter les autres noms (et l'accès par IP) ------------------------------
# À activer seulement si aucun autre vhost ne déclare déjà `default_server`
# (sur Debian/Ubuntu : supprimez d'abord /etc/nginx/sites-enabled/default),
# sinon nginx refuse de démarrer pour cause de `default_server` en double.
